name: Build CYD 2.8 Firmware

on:
  push:
    paths:
      - "firmware-cyd/**"
      - ".github/workflows/build-cyd-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: firmware-cyd
        run: pio run

      - name: Create merged factory image
        run: |
          python -m pip install esptool
          python -m esptool --chip esp32 merge_bin \
            -o firmware-cyd/PocketBeatMini-CYD-2.8.factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 firmware-cyd/.pio/build/esp32dev/bootloader.bin \
            0x8000 firmware-cyd/.pio/build/esp32dev/partitions.bin \
            0x10000 firmware-cyd/.pio/build/esp32dev/firmware.bin

      - name: Stage flash files
        run: |
          mkdir -p flash-artifact
          cp firmware-cyd/PocketBeatMini-CYD-2.8.factory.bin flash-artifact/
          cp firmware-cyd/.pio/build/esp32dev/firmware.bin flash-artifact/
          cp firmware-cyd/.pio/build/esp32dev/bootloader.bin flash-artifact/
          cp firmware-cyd/.pio/build/esp32dev/partitions.bin flash-artifact/
          cp firmware-cyd/README.md flash-artifact/README.txt

      - name: Upload flashable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketBeatMini-CYD-2.8-flash-files
          path: flash-artifact/
          if-no-files-found: error
          retention-days: 30
